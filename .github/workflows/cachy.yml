name: Compilar Neko Void Kernel cachy

on:
  workflow_dispatch:

env:
  KERNEL_REVISION: 1   

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --user root

    steps:
      - name: 1. Instalar dependencias del sistema
        run: |
          xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/ xbps 
          xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/ base-devel git bc kmod elfutils-devel bash cpio xz lz4 zstd flex bison openssl-devel curl pahole tar python3 patch wget rsync -y

      - name: 2. Checkout del repositorio
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 3. Clonar fuentes del kernel y modificar EXTRAVERSION
        run: |
          git clone --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git linux-src
          cd linux-src
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION = -cachy/' Makefile
          cd ..

      - name: 4. Obtener configuración base
        run: |
          cd linux-src
          wget -O .config https://github.com/CachyOS/linux-cachyos/raw/refs/heads/master/linux-cachyos/config
          cd ..

      - name: 5. Aplicar parche de Void
        run: |
          cd linux-src
          wget -O fixdep-largefile.patch https://github.com/void-linux/void-packages/raw/refs/heads/master/srcpkgs/linux7.2/patches/fixdep-largefile.patch
          patch -p1 -N --batch < fixdep-largefile.patch
          wget -O parche.patch https://github.com/void-linux/void-packages/raw/refs/heads/master/srcpkgs/linux7.2/patches/fix-ccache.patch
          patch -p1 -N --batch < parche.patch 

      - name: 6. Ajustar configuración
        run: |
          cd linux-src
          
          # Habilitar soporte para cgroups y el controlador dmem
          scripts/config --enable CGROUPS 
          scripts/config -e CONFIG_CGROUP_DMEM
          
          # Tus configuraciones previas
          scripts/config --disable CONFIG_LOCALVERSION_AUTO
          scripts/config --set-str CONFIG_LOCALVERSION "-bore"
          scripts/config -d CONFIG_HZ_300 -e CONFIG_HZ_1000 --set-val CONFIG_HZ 1000
          scripts/config -d CONFIG_HZ_PERIODIC -d CONFIG_NO_HZ_IDLE -e CONFIG_NO_HZ_FULL -e CONFIG_NO_HZ
          scripts/config -e CONFIG_MODULE_COMPRESS_ZSTD
          scripts/config -d CONFIG_TRANSPARENT_HUGEPAGE_MADVISE -e CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS
          scripts/config -d CONFIG_PREEMPT_VOLUNTARY
          scripts/config -d CONFIG_PREEMPT_LL
          scripts/config -d CONFIG_PREEMPT_NONE
          scripts/config -e CONFIG_PREEMPT_RT
          scripts/config --disable CONFIG_DEBUG_INFO \
                         --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT \
                         --disable CONFIG_DEBUG_INFO_REDUCED \
                         --disable CONFIG_DEBUG_INFO_BTF \
                         --disable CONFIG_DEBUG_VM \
                         --disable CONFIG_DEBUG_KERNEL \
                         --disable CONFIG_PROVE_LOCKING \
                         --disable CONFIG_LOCK_STAT \
                         --disable CONFIG_LATENCYTOP
          scripts/config --disable CONFIG_MODULE_SIG
          scripts/config --set-str CONFIG_SYSTEM_TRUSTED_KEYS ""
          cd ..

      - name: 7. Compilar el kernel y módulos
        run: |
          cd linux-src
          export KBUILD_BUILD_TIMESTAMP=$(date -u -d @0 +"%Y-%m-%d %H:%M:%S")
          export KBUILD_BUILD_USER=voidlinux
          export KBUILD_BUILD_HOST=voidlinux
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          
          make -j$(nproc) prepare V=1
          make -j$(nproc) bzImage modules V=1 2>&1 | tee ../build.log
          cd ..

      - name: 8. Subir logs de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log

      - name: 9. Instalar kernel, módulos y compilar headers
        if: success()
        run: |
          cd linux-src
          KERNEL_RELEASE=$(make kernelrelease)
          echo "KERNEL_RELEASE=${KERNEL_RELEASE}" >> $GITHUB_ENV
          
          make INSTALL_MOD_PATH=$GITHUB_WORKSPACE/modules modules_install
          
          mkdir -p $GITHUB_WORKSPACE/pkg/boot
          cp arch/x86/boot/bzImage $GITHUB_WORKSPACE/pkg/boot/vmlinuz-${KERNEL_RELEASE}
          cp System.map $GITHUB_WORKSPACE/pkg/boot/System.map-${KERNEL_RELEASE}
          cp .config $GITHUB_WORKSPACE/pkg/boot/config-${KERNEL_RELEASE}
          
          mkdir -p $GITHUB_WORKSPACE/pkg/lib/modules
          mv $GITHUB_WORKSPACE/modules/lib/modules/${KERNEL_RELEASE} $GITHUB_WORKSPACE/pkg/lib/modules/
          
          HEADERS_DIR=$GITHUB_WORKSPACE/pkg/usr/src/linux-headers-${KERNEL_RELEASE}
          mkdir -p $HEADERS_DIR/arch/x86
          
          cp Makefile .config Module.symvers System.map $HEADERS_DIR/
          cp -a scripts include $HEADERS_DIR/
          cp -a arch/x86/include $HEADERS_DIR/arch/x86/
          cp arch/x86/Makefile $HEADERS_DIR/arch/x86/ || true
          
          if [ -f tools/objtool/objtool ]; then
            mkdir -p $HEADERS_DIR/tools/objtool
            cp tools/objtool/objtool $HEADERS_DIR/tools/objtool/
          fi
          
          find $HEADERS_DIR/scripts -type f -name '*.o' -delete
          
          cd $GITHUB_WORKSPACE/pkg/lib/modules/${KERNEL_RELEASE}
          rm -f build source
          ln -sf /usr/src/linux-headers-${KERNEL_RELEASE} build
          ln -sf /usr/src/linux-headers-${KERNEL_RELEASE} source
          cd $GITHUB_WORKSPACE
          
      - name: 10. Empaquetar artefactos
        if: success()
        run: |
          cd $GITHUB_WORKSPACE/pkg
          tar -czf ../neko-kernel-void-${KERNEL_RELEASE}.tar.gz .
          cd ..

      - name: 11. Subir a Release 
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Añadido por seguridad de permisos
        with:
          tag_name: latest
          files: neko-kernel-void-*.tar.gz
