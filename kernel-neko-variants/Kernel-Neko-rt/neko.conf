# Kernel-Neko - definición de variante (leído por build-kernel-neko.sh)
NEKO_PKG="linux-neko-rt"
NEKO_DESC="Kernel-Neko Realtime (PREEMPT_RT)"
SRC_TYPE="vanilla"          # perf | vanilla | zen
SRC_TAG="7.3"           # etiqueta/versión del tarball de fuentes
MAJOR="7.3"             # rama X.Y (para parches)
KVER="7.3.0"              # versión para xbps (sin guiones)
LOCALVERSION="-neko-rt"      # sufijo de uname -r
PATCHES=()           # nombres cortos definidos en upstream.conf
PERF_TWEAKS="no"    # yes = CONFIG_CACHY (solo árbol perf)
SCHED="eevdf"          # bore | bmq | pds | eevdf
RT="yes"             # yes = PREEMPT_RT
HZ="1000"
TICK="full"           # full | idle
PREEMPT="full"        # full | lazy
THP="madvise"            # always | madvise
O3="no"             # yes = -O3
LITE="no"           # yes = perfil bajos recursos (-Os, zswap lz4, BFQ...)
