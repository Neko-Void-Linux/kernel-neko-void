# Kernel-Neko - definición de variante (leído por build-kernel-neko.sh)
NEKO_PKG="linux-neko-liquorix"
NEKO_DESC="Kernel-Neko Liquorix (PDS)"
SRC_TYPE="vanilla"          # perf | vanilla | zen
SRC_TAG="7.2"           # etiqueta/versión del tarball de fuentes
MAJOR="7.2"             # rama X.Y (para parches)
KVER="7.2.0"              # versión para xbps (sin guiones)
LOCALVERSION="-neko-lqx"      # sufijo de uname -r
PATCHES=()           # nombres cortos definidos en upstream.conf
PERF_TWEAKS="no"    # yes = CONFIG_CACHY (solo árbol perf)
SCHED="pds"          # bore | bmq | pds | eevdf
RT="no"             # yes = PREEMPT_RT
HZ="1000"
TICK="full"           # full | idle
PREEMPT="full"        # full | lazy
THP="always"            # always | madvise
O3="no"             # yes = -O3
LITE="no"           # yes = perfil bajos recursos (-Os, zswap lz4, BFQ...)
