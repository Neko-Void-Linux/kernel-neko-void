# ==============================================================================
# Kernel-Neko - Fuentes upstream
# ------------------------------------------------------------------------------
# ÚNICO archivo con URLs de proyectos externos. Las URLs de descarga deben
# apuntar a los repositorios reales o no se puede bajar nada; el resto del
# proyecto solo usa nombres "Kernel-Neko". Ver CREDITS.md.
# ==============================================================================

# Árbol de kernel con parches de rendimiento (base de la mayoría de variantes)
UP_PERF_SRC="https://github.com/CachyOS/linux/releases/download"
# Parches de planificadores / extras
UP_PERF_PATCHES="https://raw.githubusercontent.com/cachyos/kernel-patches/master"
# Kernel vanilla
UP_KERNEL_ORG="https://cdn.kernel.org/pub/linux/kernel"
# Zen
UP_ZEN="https://github.com/zen-kernel/zen-kernel/archive/refs/tags"
# Liquorix
UP_LQX="https://github.com/damentz/liquorix-package/archive/refs/heads"

# URL del tarball de fuentes según el tipo declarado en neko.conf
# Uso: neko_src_url <SRC_TYPE> <SRC_TAG>
neko_src_url() {
    local type="$1" tag="$2"
    case "$type" in
        perf)    echo "${UP_PERF_SRC}/cachyos-${tag}/cachyos-${tag}.tar.gz" ;;
        vanilla) echo "${UP_KERNEL_ORG}/v${tag%%.*}.x/linux-${tag}.tar.xz" ;;
        zen)     echo "${UP_ZEN}/v${tag}.tar.gz" ;;
        *)       return 1 ;;
    esac
}

# URL de un parche por nombre corto
# Uso: neko_patch_url <nombre> <major>
neko_patch_url() {
    local name="$1" major="$2"
    case "$name" in
        bore)      echo "${UP_PERF_PATCHES}/${major}/sched/0001-bore-cachy.patch" ;;
        bmq)       echo "${UP_PERF_PATCHES}/${major}/sched/0001-prjc-cachy.patch" ;;
        rt-i915)   echo "${UP_PERF_PATCHES}/${major}/misc/0001-rt-i915.patch" ;;
        hardened)  echo "${UP_PERF_PATCHES}/${major}/misc/0001-hardened.patch" ;;
        acpi-call) echo "${UP_PERF_PATCHES}/${major}/misc/0001-acpi-call.patch" ;;
        handheld)  echo "${UP_PERF_PATCHES}/${major}/misc/0001-handheld.patch" ;;
        *)         return 1 ;;
    esac
}

# Paquete de parches Liquorix (rama <major>/master)
neko_lqx_url() { echo "${UP_LQX}/$1/master.tar.gz"; }
