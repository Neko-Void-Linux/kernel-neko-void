# Kernel-Neko - definición de variante (leído por build-kernel-neko.sh)
NEKO_PKG="linux-neko-lite"
NEKO_DESC="Kernel-Neko Lite LTS (bajos recursos)"
SRC_TYPE="perf"          # perf | vanilla | zen
SRC_TAG="6.18.55-1"           # etiqueta/versión del tarball de fuentes
MAJOR="6.18"             # rama X.Y (para parches)
KVER="6.18.55"              # versión para xbps (sin guiones)
LOCALVERSION="-neko-lite"      # sufijo de uname -r
PATCHES=()           # nombres cortos definidos en upstream.conf
PERF_TWEAKS="no"    # yes = CONFIG_CACHY (solo árbol perf)
SCHED="eevdf"          # bore | bmq | pds | eevdf
RT="no"             # yes = PREEMPT_RT
HZ="300"
TICK="idle"           # full | idle
PREEMPT="full"        # full | lazy
THP="madvise"            # always | madvise
O3="no"             # yes = -O3
LITE="yes"           # yes = perfil bajos recursos (-Os, zswap lz4, BFQ...)
