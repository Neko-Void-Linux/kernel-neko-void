# Kernel-Neko - definición de variante (leído por build-kernel-neko.sh)
NEKO_PKG="linux-neko"
NEKO_DESC="Kernel-Neko standard (BORE)"
SRC_TYPE="perf"          # perf | vanilla | zen
SRC_TAG="7.3.0-2"           # etiqueta/versión del tarball de fuentes
MAJOR="7.3"             # rama X.Y (para parches)
KVER="7.3.0"              # versión para xbps (sin guiones)
LOCALVERSION="-neko"      # sufijo de uname -r
PATCHES=(bore)           # nombres cortos definidos en upstream.conf
PERF_TWEAKS="yes"    # yes = CONFIG_CACHY (solo árbol perf)
SCHED="bore"          # bore | bmq | pds | eevdf
RT="no"             # yes = PREEMPT_RT
HZ="1000"
TICK="full"           # full | idle
PREEMPT="full"        # full | lazy
THP="always"            # always | madvise
O3="yes"             # yes = -O3
LITE="no"           # yes = perfil bajos recursos (-Os, zswap lz4, BFQ...)
